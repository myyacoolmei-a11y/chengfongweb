<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晟風｜真人客服後台</title><style>body{background:#f5f5f1;font-family:system-ui,"Noto Sans TC",sans-serif;color:#111;margin:0}main{max-width:1020px;margin:auto;padding:24px}h1{font-size:25px}input,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px}button{background:#111;color:#fff;cursor:pointer}input{display:block;margin:10px 0;max-width:350px;width:100%;box-sizing:border-box}#layout{display:grid;grid-template-columns:290px 1fr;gap:16px}#threads,#messages{background:white;border:1px solid #ddd;border-radius:12px;padding:14px;max-height:60vh;min-height:360px;overflow:auto}.thread{display:block;width:100%;margin:6px 0;background:#eee;color:#111;text-align:left}.thread.selected,.mine{background:#d9ff6c}textarea{display:block;box-sizing:border-box;width:100%;margin:12px 0}.msg{margin:8px 0;padding:12px;border-radius:9px;background:#eee;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine{background:#d9ff6c}.msg small{display:block;margin-bottom:8px;color:#666}@media(max-width:650px){#layout{grid-template-columns:1fr}}</style></head><body><main><h1>CHENG FONG｜真人客服後台</h1><p id="notice">請使用已授權的客服 Email 與密碼登入。</p><section id="login"><input id="email" type="email" autocomplete="username" placeholder="客服 Email"><input id="password" type="password" autocomplete="current-password" placeholder="客服密碼"><button id="loginBtn">登入</button></section><section id="app" hidden><button id="logout">登出</button><div id="layout"><section><h3>客戶對話</h3><div id="threads"></div></section><section><h3 id="subject">選擇對話</h3><div id="messages"></div><textarea id="reply" rows="3" placeholder="輸入回覆內容"></textarea><button id="send">送出回覆</button></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const c=window.supabase.createClient('https://lvsrpibovypabehttszj.supabase.co','sb_publishable_tTPLagFPFxxmSJPNQDQ_rQ_049mD7My');const $=x=>document.getElementById(x);let selected=null;
function msg(t){$('notice').textContent=t}
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e}
async function gate(){const u=(await c.auth.getUser()).data.user;if(!u||u.is_anonymous){$('app').hidden=true;$('login').hidden=false;return}const r=await c.from('cf_agents').select('user_id').eq('user_id',u.id).maybeSingle();if(r.error||!r.data){msg('此帳號沒有晟風客服權限；請管理員授權後再登入。');$('app').hidden=true;await c.auth.signOut();return}$('login').hidden=true;$('app').hidden=false;msg('客服已登入，對話每 5 秒更新。');await refresh()}
$('loginBtn').onclick=async()=>{const r=await c.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){msg('登入失敗：'+r.error.message);return}await gate()};
$('logout').onclick=async()=>{await c.auth.signOut();location.reload()};
async function refresh(){const r=await c.from('cf_conversations').select('id,status,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){msg('讀取失敗：'+r.error.message);return}const list=$('threads');list.replaceChildren();for(const item of r.data||[]){const b=node('button',new Date(item.created_at).toLocaleString('zh-TW')+' / '+item.status,'thread'+(selected===item.id?' selected':''));b.onclick=()=>{selected=item.id;refresh()};list.append(b)}if(selected)await loadMessages()}
async function loadMessages(){const r=await c.from('cf_messages').select('id,body,sender_id,created_at').eq('conversation_id',selected).order('id',{ascending:true}).limit(300);if(r.error){msg(r.error.message);return}const uid=(await c.auth.getUser()).data.user.id;$('subject').textContent='對話 '+selected.slice(0,8);const area=$('messages');area.replaceChildren();for(const item of r.data||[]){let d=node('div','','msg'+(item.sender_id===uid?' mine':''));d.append(node('small',new Date(item.created_at).toLocaleString('zh-TW')+' / '+(item.sender_id===uid?'客服':'客人')),node('div',item.body));area.append(d)}area.scrollTop=area.scrollHeight}
$('send').onclick=async()=>{if(!selected)return msg('請先選擇對話');const body=$('reply').value.trim();if(!body)return;const uid=(await c.auth.getUser()).data.user.id;const r=await c.from('cf_messages').insert({conversation_id:selected,sender_id:uid,body:body.slice(0,2000)});if(r.error){msg('送出失敗：'+r.error.message);return}$('reply').value='';await loadMessages()};
setInterval(()=>{if(!$('app').hidden)refresh()},5000);gate();
</script></body></html>
